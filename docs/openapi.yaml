openapi: 3.1.0
info:
  title: Read-only Shopify Product Information API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Read-only product, variant, SKU, barcode, and inventory retrieval for a
    Custom GPT. Choose the exact SKU or barcode operation when that identifier
    is available; use product search for titles, vendors, product types, or
    general discovery; and use product detail only with an ID returned by a
    previous result. All operations require an application bearer API key.
servers:
  - url: https://test-run-read-only-api.ww-api.workers.dev
    description: Production Cloudflare Worker for the read-only product API.
security:
  - internalApiKey: []
tags:
  - name: System
    description: Read-only service status information.
  - name: Products
    description: Read-only Shopify product and variant information.
  - name: Inventory
    description: Read-only inventory quantities for an identified variant.
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API health
      description: >-
        Use only to confirm API reachability or diagnose a failed tool call.
        Returns service status and the Shopify Admin API version, but no
        product or store data.
      responses:
        '200':
          description: The API is running and its Worker bindings are valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/products/search:
    get:
      tags: [Products]
      operationId: searchProducts
      summary: Search products
      description: >-
        Find products by title or free text, vendor, product type, or combined
        filters. Use the exact SKU or barcode operation when known. Pass
        pageInfo.endCursor unchanged as after for another page, then use a
        returned ID for product details or variant inventory.
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Free-text product search phrase. Whitespace is normalized. Maximum
            length is 200 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: vendor
          in: query
          required: false
          description: Exact Shopify vendor filter. Maximum length is 200 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: productType
          in: query
          required: false
          description: Exact Shopify product type filter. Maximum length is 200 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          description: Number of products to return. Defaults to 10 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: after
          in: query
          required: false
          description: >-
            Opaque pagination cursor from the previous response's
            pageInfo.endCursor. Do not construct or modify this value.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: '^[A-Za-z0-9+/_=-]+$'
      responses:
        '200':
          description: A page of matching products. An empty products array means no matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ShopifyUpstreamError'
        '503':
          $ref: '#/components/responses/ShopifyThrottled'
        '504':
          $ref: '#/components/responses/ShopifyTimeout'
  /api/products/by-sku/{sku}:
    get:
      tags: [Products]
      operationId: findProductsBySku
      summary: Find variants by SKU
      description: >-
        Use when an exact SKU is known. Returns product and variant details
        with inventory quantities by location in one call. Inspect state before
        using matches: product_not_found means none, and ambiguous means the SKU
        matched multiple variants.
      parameters:
        - name: sku
          in: path
          required: true
          description: Exact SKU to look up. URL-encode the value when necessary.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Exact SKU result with inventory, ambiguity metadata, and matching identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExactVariantLookupResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ShopifyUpstreamError'
        '503':
          $ref: '#/components/responses/ShopifyThrottled'
        '504':
          $ref: '#/components/responses/ShopifyTimeout'
  /api/products/by-barcode/{barcode}:
    get:
      tags: [Products]
      operationId: findProductsByBarcode
      summary: Find variants by barcode
      description: >-
        Use when an exact barcode is known. Preserve leading zeroes. Returns
        product and variant details with inventory by location in one call.
        Inspect state before using matches: product_not_found means none, and
        ambiguous means multiple variants matched.
      parameters:
        - name: barcode
          in: path
          required: true
          description: Exact barcode string to look up. URL-encode the value when necessary.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Exact barcode result with inventory, ambiguity metadata, and matching identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExactVariantLookupResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ShopifyUpstreamError'
        '503':
          $ref: '#/components/responses/ShopifyThrottled'
        '504':
          $ref: '#/components/responses/ShopifyTimeout'
  /api/variants/{id}/inventory:
    get:
      tags: [Inventory]
      operationId: getVariantInventory
      summary: Get inventory for a variant
      description: >-
        Use after search, SKU lookup, or barcode lookup identifies a variant.
        Returns tracked status and paginated available, on-hand, and incoming
        quantities by location, including staff-useful address fields.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric Shopify variant ID or URL-encoded ProductVariant GID.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Inventory locations to return. Defaults to 20 and cannot exceed 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: after
          in: query
          required: false
          description: >-
            Opaque cursor from inventoryItem.pageInfo.endCursor. Pass it
            unchanged to retrieve the next page of inventory locations.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: '^[A-Za-z0-9+/_=-]+$'
      responses:
        '200':
          description: Variant inventory quantities grouped by Shopify location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantInventoryResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VariantNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ShopifyUpstreamError'
        '503':
          $ref: '#/components/responses/ShopifyThrottled'
        '504':
          $ref: '#/components/responses/ShopifyTimeout'
  /api/products/{id}:
    get:
      tags: [Products]
      operationId: getProductById
      summary: Get one product by ID
      description: >-
        Use only when a product ID is known from search, SKU lookup, or barcode
        lookup. Returns product details, variants, selected options, prices,
        inventory, and locations. Do not use for title, SKU, or barcode search.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric Shopify product ID or URL-encoded Shopify Product GID.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ShopifyUpstreamError'
        '503':
          $ref: '#/components/responses/ShopifyThrottled'
        '504':
          $ref: '#/components/responses/ShopifyTimeout'
components:
  securitySchemes:
    internalApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: >-
        Application-level API key supplied as Authorization: Bearer <key>.
        Configure the actual key outside this document using INTERNAL_API_KEY.
  schemas:
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
          description: Correlation ID to provide when diagnosing a request.
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasNextPage, endCursor]
      properties:
        hasNextPage:
          type: boolean
          description: Whether Shopify reports another page.
        endCursor:
          type: [string, 'null']
          description: Opaque cursor for the next request, or null when unavailable.
    SelectedOption:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    InventoryQuantity:
      type: object
      additionalProperties: false
      required: [name, quantity]
      properties:
        name:
          type: string
          enum: [available, on_hand, incoming]
        quantity:
          type: integer
          description: Exact inventory quantity returned by Shopify; zero is meaningful.
    Location:
      type: object
      additionalProperties: false
      required: [id, name, active, address]
      properties:
        id:
          type: string
          description: Shopify Location GID retained for follow-up operations.
        name:
          type: string
        active:
          type: boolean
          description: Whether Shopify reports the inventory location as active.
        address:
          $ref: '#/components/schemas/LocationAddress'
    LocationAddress:
      type: object
      additionalProperties: false
      required:
        - address1
        - address2
        - city
        - province
        - provinceCode
        - country
        - countryCode
        - zip
        - phone
      properties:
        address1:
          type: [string, 'null']
        address2:
          type: [string, 'null']
        city:
          type: [string, 'null']
        province:
          type: [string, 'null']
        provinceCode:
          type: [string, 'null']
        country:
          type: [string, 'null']
        countryCode:
          type: [string, 'null']
        zip:
          type: [string, 'null']
        phone:
          type: [string, 'null']
    InventoryLevel:
      type: object
      additionalProperties: false
      required: [id, location, quantities]
      properties:
        id:
          type: string
          description: Shopify InventoryLevel ID.
        location:
          $ref: '#/components/schemas/Location'
        quantities:
          type: array
          description: Exact named quantities returned by Shopify.
          items:
            $ref: '#/components/schemas/InventoryQuantity'
    InventoryItem:
      type: object
      additionalProperties: false
      required: [id, tracked, levels, pageInfo]
      properties:
        id:
          type: string
          description: Shopify InventoryItem GID retained for follow-up operations.
        tracked:
          type: boolean
        levels:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLevel'
        pageInfo:
          description: Inventory-level pagination information, or null if levels were not requested.
          anyOf:
            - $ref: '#/components/schemas/PageInfo'
            - type: 'null'
    ProductVariant:
      type: object
      additionalProperties: false
      required: [id, title, sku, barcode, price, selectedOptions, inventoryItem]
      properties:
        id:
          type: string
          description: Shopify ProductVariant GID retained for follow-up operations.
        title:
          type: string
        sku:
          type: [string, 'null']
          description: Exact SKU returned by Shopify, or null when no SKU is assigned.
        barcode:
          type: [string, 'null']
          description: Exact barcode returned by Shopify, or null when no barcode is assigned.
        price:
          type: string
          description: Exact decimal price string returned by Shopify. No currency is inferred.
        selectedOptions:
          type: array
          items:
            $ref: '#/components/schemas/SelectedOption'
        inventoryItem:
          description: Inventory information, or null when the variant has no accessible inventory item.
          anyOf:
            - $ref: '#/components/schemas/InventoryItem'
            - type: 'null'
    ProductMetafield:
      type: object
      additionalProperties: false
      required: [namespace, key, type, value]
      properties:
        namespace:
          type: string
        key:
          type: string
        type:
          type: string
        value:
          description: Parsed Shopify metafield JSON value. Its type depends on the metafield definition.
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - handle
        - status
        - vendor
        - productType
        - tags
        - variants
        - variantsPageInfo
        - metafields
      properties:
        id:
          type: string
          description: Shopify Product GID retained for follow-up calls.
        title:
          type: string
        handle:
          type: string
        status:
          type: string
        vendor:
          type: string
        productType:
          type: string
        tags:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        variantsPageInfo:
          $ref: '#/components/schemas/PageInfo'
        metafields:
          type: array
          items:
            $ref: '#/components/schemas/ProductMetafield'
    ExactVariantLookupMatch:
      type: object
      additionalProperties: false
      required: [product, variant, inventoryState]
      properties:
        product:
          $ref: '#/components/schemas/ExactLookupProduct'
        variant:
          $ref: '#/components/schemas/ExactLookupVariant'
        inventoryState:
          $ref: '#/components/schemas/InventoryResultState'
    ExactLookupProduct:
      type: object
      additionalProperties: false
      required: [id, title, status, vendor, productType]
      properties:
        id:
          type: string
          description: Shopify Product GID retained for follow-up calls.
        title:
          type: string
        status:
          type: string
        vendor:
          type: string
        productType:
          type: string
    ExactLookupLocation:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          description: Shopify Location GID.
        name:
          type: string
    ExactLookupInventoryLevel:
      type: object
      additionalProperties: false
      required: [id, location, available, on_hand, incoming]
      properties:
        id:
          type: string
          description: Shopify InventoryLevel ID.
        location:
          $ref: '#/components/schemas/ExactLookupLocation'
        available:
          type: [integer, 'null']
          description: Exact available quantity, or null if Shopify omitted this state.
        on_hand:
          type: [integer, 'null']
          description: Exact on-hand quantity, or null if Shopify omitted this state.
        incoming:
          type: [integer, 'null']
          description: Exact incoming quantity, or null if Shopify omitted this state.
    ExactLookupInventoryItem:
      type: object
      additionalProperties: false
      required: [id, tracked, levels, pageInfo]
      properties:
        id:
          type: string
          description: Shopify InventoryItem GID.
        tracked:
          type: boolean
          description: Whether Shopify tracks inventory for this variant.
        levels:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ExactLookupInventoryLevel'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    ExactLookupVariant:
      type: object
      additionalProperties: false
      required: [id, title, sku, barcode, price, inventoryItem]
      properties:
        id:
          type: string
          description: Shopify ProductVariant GID.
        title:
          type: string
        sku:
          type: [string, 'null']
          description: Exact SKU returned by Shopify, including punctuation and leading zeroes.
        barcode:
          type: [string, 'null']
          description: Exact barcode returned by Shopify, including leading zeroes.
        price:
          type: string
          description: Exact decimal price string returned by Shopify.
        inventoryItem:
          description: Inventory data, or null when no inventory item is accessible.
          anyOf:
            - $ref: '#/components/schemas/ExactLookupInventoryItem'
            - type: 'null'
    InventoryResultState:
      type: string
      enum:
        - found_with_inventory
        - found_zero_inventory
        - inventory_not_tracked
        - no_inventory_levels
      description: Inventory outcome for one exact variant match.
    ExactVariantLookupData:
      type: object
      additionalProperties: false
      required: [state, matchCount, hasAdditionalMatches, matches]
      properties:
        state:
          type: string
          enum:
            - found_with_inventory
            - found_zero_inventory
            - inventory_not_tracked
            - no_inventory_levels
            - product_not_found
            - ambiguous
          description: Overall exact-lookup outcome. Do not select a match when ambiguous.
        matchCount:
          type: integer
          minimum: 0
          maximum: 2
          description: Number of distinguishing matches returned by this bounded lookup.
        hasAdditionalMatches:
          type: boolean
          description: Whether Shopify reports more matching variants than were returned.
        matches:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/ExactVariantLookupMatch'
    ProductSearchResult:
      type: object
      additionalProperties: false
      required: [products, pageInfo]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    HealthData:
      type: object
      additionalProperties: false
      required: [status, adminApiVersion]
      properties:
        status:
          type: string
          const: ok
        adminApiVersion:
          type: string
          pattern: '^\\d{4}-(01|04|07|10)$'
          description: Shopify Admin GraphQL API version used by this service.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/HealthData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ProductSearchResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ProductSearchResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ExactVariantLookupResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ExactVariantLookupData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ProductResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VariantInventoryData:
      type: object
      additionalProperties: false
      required: [state, variant]
      properties:
        state:
          type: string
          enum:
            - found_with_inventory
            - found_zero_inventory
            - inventory_not_tracked
            - no_inventory_levels
          description: Exact inventory outcome for the returned variant and page of locations.
        variant:
          $ref: '#/components/schemas/ProductVariant'
    VariantInventoryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/VariantInventoryData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorDetail:
      type: object
      additionalProperties: false
      description: >-
        Sanitized diagnostic metadata such as retryability, result state,
        upstream status, or invalid parameter names. Never contains credentials
        or Shopify-internal error and request details.
      properties:
        retryable:
          type: boolean
          description: Whether retrying the request may succeed.
        upstreamStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: Sanitized HTTP status returned by Shopify, when available.
        state:
          type: string
          enum: [product_not_found, temporary_upstream_failure]
          description: Machine-readable not-found or temporary-failure outcome when applicable.
        parameters:
          type: array
          uniqueItems: true
          description: Unsupported query parameter names supplied by the caller.
          items:
            type: string
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_INPUT
            - UNAUTHORIZED
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - INTERNAL_ERROR
            - SHOPIFY_UPSTREAM_ERROR
            - SHOPIFY_THROTTLED
            - SHOPIFY_TIMEOUT
            - TEMPORARY_UPSTREAM_FAILURE
        message:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  responses:
    InvalidInput:
      description: A request parameter or path value is missing, malformed, duplicated, or out of range.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: The bearer API key is missing or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProductNotFound:
      description: No product exists for the supplied ID. This is distinct from an upstream API failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VariantNotFound:
      description: No product variant exists for the supplied ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: The route is read-only and supports GET only.
      headers:
        Allow:
          schema:
            type: string
            const: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: The service encountered an unexpected internal error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShopifyUpstreamError:
      description: Shopify rejected or could not complete the upstream read request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShopifyThrottled:
      description: Shopify temporarily failed or throttled the read request. Wait before retrying.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying.
          schema:
            type: string
            pattern: '^\d+(?:\.\d+)?$'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShopifyTimeout:
      description: Shopify did not respond before the upstream timeout. The request can be retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
